<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dog Man: Sentence Mission</title>
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        /* Dog Man / Comic Book Palette */
        :root {
            --ink: #0d2b5e;
            --blue: #1976d2;
            --blue-dark: #1565c0;
            --sky: #bbdefb;
            --pale: #e3f2fd;
            --yellow: #ffeb3b;
            --green: #4caf50;
            --orange: #ff9800;
            --red: #e53935;
            --sw: 95px; /* symbol size; JS shrinks it if a screen is too short */
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--sky); font-family: 'Comic Sans MS', 'Chalkboard SE', cursive; touch-action: none; }
        @supports (height: 100dvh) { html, body { height: 100dvh; } }
        body { display: flex; align-items: center; justify-content: center; padding: 5px; box-sizing: border-box; }

        /* Prevent selection and ghosting */
        body, #game-container, .symbol, .bank, #drop-zone, #workspace {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img { -webkit-user-drag: none; }

        #home-link {
            position: absolute; top: 15px; left: 15px; background: var(--yellow); padding: 0;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-decoration: none;
            font-size: 24px; z-index: 4000; display: flex; align-items: center; justify-content: center;
            width: 55px; height: 55px; border: 4px solid var(--blue);
        }

        #game-container, #result-screen {
            width: 100%; max-width: 1200px; height: 100%; background: white;
            padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; box-sizing: border-box;
            position: relative; overflow: hidden; border: 6px solid var(--blue);
        }

        .hidden { display: none !important; }

        #progress-container { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 10px; background: var(--pale); padding: 10px; border-radius: 12px; flex-shrink: 0; flex-wrap: wrap; }
        .progress-node { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #90caf9; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: #1e88e5; }
        .node-active { border-color: #ffc107; background: #fff; box-shadow: 0 0 8px rgba(255, 193, 7, 0.7); transform: scale(1.1); }
        .node-complete { background: var(--green); border-color: #2e7d32; color: white; }
        .score-display { font-weight: bold; color: var(--blue); margin-left: 10px; }

        #main-content { display: flex; flex-direction: row; gap: 15px; flex: 1 1 0; min-height: 0; min-width: 0; }
        #gif-container { flex: 1 1 0; min-width: 0; min-height: 0; background: #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--blue); overflow: hidden; }
        #trial-gif { max-width: 100%; max-height: 100%; object-fit: contain; }

        #workspace { flex: 1.2 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
        #drop-zone { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #f5f5f5; border: 4px dashed var(--blue); min-height: calc(var(--sw) * 0.95 + 30px); border-radius: 15px; justify-content: center; align-items: center; }
        .bank { flex: 1 1 0; min-height: 0; display: flex; gap: 8px; justify-content: center; align-content: center; flex-wrap: wrap; padding: 10px; background: #fff; border-radius: 10px; overflow: hidden; }

        .symbol { padding: 2px; border-radius: 10px; cursor: grab; font-weight: bold; width: var(--sw); height: calc(var(--sw) * 0.947); font-size: calc(var(--sw) * 0.135); flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: white; }
        .symbol img { width: calc(var(--sw) * 0.76); height: calc(var(--sw) * 0.76); object-fit: contain; pointer-events: none; }

        .who { border: 5px solid var(--yellow); }
        .doing { border: 5px solid var(--green); }
        .what { border: 5px solid var(--orange); }

        #feedback { flex-shrink: 0; font-weight: bold; font-size: 1.4rem; min-height: 30px; line-height: 30px; text-align: center; margin: 5px 0; }
        #button-row { display: flex; justify-content: center; gap: 15px; flex-shrink: 0; padding-bottom: 6px; }
        button { padding: 12px 30px; font-size: 1rem; cursor: pointer; border-radius: 50px; border: none; font-weight: bold; text-transform: uppercase; font-family: inherit; }
        button:focus-visible, #home-link:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
        #check-btn { background: #1e88e5; color: white; }
        #next-btn { background: var(--orange); color: white; display: none; }
        #result-screen > button { flex-shrink: 0; }

        /* ---------- Title screen ---------- */
        #audio-unlock-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white;
            background-color: var(--blue-dark);
            /* comic halftone dots over a sunburst */
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.16) 2.5px, transparent 3px),
                repeating-conic-gradient(from 0deg at 50% 45%, var(--blue) 0 7.5deg, var(--blue-dark) 7.5deg 15deg);
            background-size: 22px 22px, 100% 100%;
        }
        #title-card { position: relative; z-index: 3010; padding: 0 20px; }
        #title-main {
            font-family: Impact, 'Arial Black', 'Comic Sans MS', sans-serif;
            font-size: clamp(3.4rem, 13vw, 7.5rem); line-height: 1; margin: 0; letter-spacing: 3px; color: var(--yellow);
            transform: rotate(-3deg);
            text-shadow: -4px -4px 0 var(--ink), 4px -4px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink),
                         0 10px 0 var(--ink), 0 16px 0 rgba(0,0,0,0.28);
        }
        #title-sub {
            display: inline-block; margin: 14px 0 0 0; padding: 6px 36px;
            font-family: Impact, 'Arial Black', 'Comic Sans MS', sans-serif; font-weight: normal; letter-spacing: 2px;
            font-size: clamp(1.2rem, 3.5vw, 1.9rem); text-transform: uppercase;
            background: var(--red); color: white; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
            transform: rotate(-3deg);
        }
        #title-hint { margin: 26px 0 22px; font-size: clamp(1rem, 2.4vw, 1.3rem); font-weight: bold; text-shadow: 0 2px 0 var(--ink); }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        #start-btn {
            background: var(--yellow); color: var(--ink); border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
            font-family: Impact, 'Arial Black', 'Comic Sans MS', sans-serif; font-weight: normal; letter-spacing: 3px;
            font-size: clamp(1.6rem, 4vw, 2.4rem); padding: 14px 64px; animation: pulse 1.6s ease-in-out infinite;
        }
        #start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); animation: none; }
        #settings-btn { background: var(--ink); color: white; border: 3px solid white; margin-top: 26px; padding: 10px 25px; }

        /* Title screen GIFs, framed like comic panels */
        .title-screen-gif { position: absolute; width: clamp(110px, 20vw, 250px); height: auto; pointer-events: none; z-index: 3005; background: white; border: 6px solid white; border-radius: 6px; box-shadow: 0 8px 0 var(--ink), 0 0 0 4px var(--ink); }
        #title-gif-tr { top: 28px; right: 34px; transform: rotate(4deg); }
        #title-gif-bl { bottom: 34px; left: 34px; transform: rotate(-4deg); }

        #settings-modal { display: none; position: absolute; background: white; color: #333; padding: 25px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); z-index: 3500; width: 320px; max-width: calc(100vw - 30px); box-sizing: border-box; border: 5px solid var(--yellow); }
        #settings-modal input[type=range] { accent-color: var(--blue); }

        /* ---------- Overlays ---------- */
        #dance-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(25, 118, 210, 0.9); }
        #celebration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease-in-out; }
        #dance-gif, #celebration-gif { max-width: 85%; max-height: 75%; border: 10px solid var(--yellow); border-radius: 20px; }
        #dance-overlay h2 { color: white; margin-top: 15px; }
        #celebration-overlay h1 { color: var(--blue); font-size: clamp(1.8rem, 5vw, 3rem); margin-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--pale); padding: 12px; border-bottom: 2px solid var(--blue); text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }

        /* ---------- Responsive ---------- */
        /* iPad portrait / narrow windows: stack the picture above the workspace */
        @media (max-aspect-ratio: 1/1), (max-width: 760px) {
            #main-content { flex-direction: column; }
            #workspace { flex: 1.5 1 0; }
        }
        @media (max-width: 900px) { #progress-container { padding-left: 70px; padding-right: 70px; } }
        /* Short screens (Chromebooks, landscape iPads, small laptops) */
        @media (max-height: 760px) {
            body { padding: 3px; }
            #game-container, #result-screen { padding: 8px; border-width: 4px; }
            #progress-container { padding: 5px; gap: 4px; margin-bottom: 6px; }
            .progress-node { width: 22px; height: 22px; font-size: 0.62rem; }
            button { padding: 9px 22px; font-size: 0.9rem; }
            #feedback { font-size: 1.15rem; min-height: 24px; line-height: 24px; margin: 2px 0; }
            #drop-zone { padding: 6px; }
            .bank { padding: 6px; }
            #title-hint { margin: 16px 0 14px; }
            #start-btn { padding: 10px 48px; }
            #settings-btn { margin-top: 18px; }
        }
        @media (max-height: 520px), (max-width: 700px) { .title-screen-gif { display: none; } }
        @media (prefers-reduced-motion: reduce) { #start-btn { animation: none; } }
    </style>
</head>
<body>

    <a href="index.html" id="home-link" aria-label="Home">🏠</a>

    <div id="audio-unlock-overlay">
        <img src="images/dogman-title-one.gif" id="title-gif-tr" class="title-screen-gif" alt="">
        <img src="images/dogman-title-two.gif" id="title-gif-bl" class="title-screen-gif" alt="">

        <div id="title-card">
            <h1 id="title-main">DOG MAN</h1>
            <h2 id="title-sub">Sentence Mission</h2>
            <p id="title-hint">Drag the pictures to build the sentence!</p>
            <button id="start-btn" onclick="startApp()">START</button>
            <br>
            <button id="settings-btn" onclick="toggleSettings()">⚙ SETTINGS</button>
        </div>

        <div id="settings-modal">
            <h3 style="color:#1976d2; margin-top:0;">Mission Setup</h3>
            <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>Trials:</span><span id="trial-count-val" style="color:#1976d2;">10</span></div>
            <input type="range" id="trial-slider" min="5" max="20" step="5" value="10" oninput="updateTrialText(this.value)" style="width:100%; margin:15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>Foils:</span><span id="foil-val" style="color:#1976d2;">2</span></div>
            <input type="range" id="foil-slider" min="0" max="3" value="2" oninput="updateFoilText(this.value)" style="width:100%; margin:15px 0;">
            <button onclick="toggleSettings()" style="background:#1976d2; color:white; width:100%; margin-top:10px;">SAVE</button>
        </div>
    </div>

    <div id="dance-overlay" onclick="nextTrial()">
        <img id="dance-gif" src="" alt="Hero Dance">
        <h2>TAP TO CONTINUE!</h2>
    </div>

    <div id="celebration-overlay">
        <h1>MISSION ACCOMPLISHED!</h1>
        <img id="celebration-gif" src="images/dogman_celebration.gif" alt="Celebration!">
    </div>

    <div id="game-container">
        <div id="progress-container"><div class="score-display">Score: <span id="score-val">0</span></div></div>
        <div id="main-content">
            <div id="gif-container"><img id="trial-gif" src="" alt="Action"></div>
            <div id="workspace">
                <div id="drop-zone"></div>
                <div class="bank" id="word-bank"></div>
                <div id="feedback"></div>
                <div id="button-row">
                    <button id="check-btn" onclick="checkAnswer()">Check Answer</button>
                    <button id="next-btn" onclick="nextTrial()">Next Trial &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="text-align:center; padding: 10px;">
            <h1 style="margin: 0; color: #1976d2;">Mission Report</h1>
            <div style="font-size: 3rem; color: #ff9800; font-weight:bold;" id="final-pct">0%</div>
        </div>
        <div style="flex-grow: 1; overflow-y: auto; padding: 0 20px;">
            <table>
                <thead><tr><th>#</th><th>Mission Target</th><th>Result</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
        <button onclick="location.reload()" style="background:#1976d2; color:white; margin:20px auto; display:block;">Restart Mission</button>
    </div>

    <script>
        let numFoils = 2;
        let totalTrialsRequested = 10;
        let sessionTrials = [];
        let currentIndex = 0, score = 0, trialLog = [];
        let rewardShown = false, rewardTimer = null;

        // Loop music logic
        const currentDanceSong = new Audio();
        const danceSongs = [
            'sounds/dogman-song-one.mp3',
            'sounds/dogman-song-two.mp3',
            'sounds/dogman-song-three.mp3',
            'sounds/dogman-song-four.mp3',
            'sounds/dogman-song-five.mp3'
        ];

        const sounds = {
            drop: new Audio('sounds/drop.mp3'),
            incorrect: new Audio('sounds/incorrect_answer.mp3'),
            celebration: new Audio('sounds/celebration_results.mp3')
        };
        const danceGifs = ['images/dogman-one.gif', 'images/dogman-two.gif', 'images/dogman-three.gif', 'images/dogman-four.gif', 'images/dogman-five.gif', 'images/dogman-six.gif', 'images/dogman-seven.gif', 'images/dogman-eight.gif'];

        const trialsData = [
            { gif: "images/he_feel_hot.gif", who: "He", whoImg: "symbols/he.png", doing: "feels", doingImg: "symbols/feel.png", what: "hot", whatImg: "symbols/hot.png" },
            { gif: "images/he_eat_spaghetti.gif", who: "He", whoImg: "symbols/he.png", doing: "eats", doingImg: "symbols/eat.png", what: "spaghetti", whatImg: "symbols/spaghetti.png" },
            { gif: "images/he_drinks_coffee.gif", who: "He", whoImg: "symbols/he.png", doing: "drinks", doingImg: "symbols/drink.png", what: "coffee", whatImg: "symbols/coffee.png" },
            { gif: "images/he_eat_popcorn.gif", who: "He", whoImg: "symbols/he.png", doing: "eats", doingImg: "symbols/eat.png", what: "popcorn", whatImg: "symbols/popcorn.png" },
            { gif: "images/he_give_flower.gif", who: "He", whoImg: "symbols/he.png", doing: "gives", doingImg: "symbols/give.png", what: "flower", whatImg: "symbols/flower.png" },
            { gif: "images/he_make_hotdog.gif", who: "He", whoImg: "symbols/he.png", doing: "makes", doingImg: "symbols/make.png", what: "hot dog", whatImg: "symbols/hotdog.png" },
            { gif: "images/he_hug_dog.gif", who: "He", whoImg: "symbols/he.png", doing: "hugs", doingImg: "symbols/hug.png", what: "dog", whatImg: "symbols/dog.png" },
            { gif: "images/he_kick_ball.gif", who: "He", whoImg: "symbols/he.png", doing: "kicks", doingImg: "symbols/kick.png", what: "ball", whatImg: "symbols/ball.png" },
            { gif: "images/he_ride_boat.gif", who: "He", whoImg: "symbols/he.png", doing: "rides", doingImg: "symbols/ride.png", what: "boat", whatImg: "symbols/boat.png" },
            { gif: "images/she_drink_water.gif", who: "She", whoImg: "symbols/she.png", doing: "drinks", doingImg: "symbols/drink.png", what: "water", whatImg: "symbols/water.png" },
            { gif: "images/she_hold_balloon.gif", who: "She", whoImg: "symbols/she.png", doing: "holds", doingImg: "symbols/hold.png", what: "balloon", whatImg: "symbols/balloon.png" },
            { gif: "images/she_hug_cat.gif", who: "She", whoImg: "symbols/she.png", doing: "hugs", doingImg: "symbols/hug.png", what: "cat", whatImg: "symbols/cat.png" },
            { gif: "images/she_make_music.gif", who: "She", whoImg: "symbols/she.png", doing: "makes", doingImg: "symbols/make.png", what: "music", whatImg: "symbols/music.png" },
            { gif: "images/she_see_bunny.gif", who: "She", whoImg: "symbols/she.png", doing: "sees", doingImg: "symbols/see.png", what: "bunny", whatImg: "symbols/bunny.png" },
            { gif: "images/she_wash_hands.gif", who: "She", whoImg: "symbols/she.png", doing: "washes", doingImg: "symbols/wash.png", what: "hands", whatImg: "symbols/hands.png" },
            { gif: "images/she_ride_bike.gif", who: "She", whoImg: "symbols/she.png", doing: "rides", doingImg: "symbols/ride.png", what: "bike", whatImg: "symbols/bike.png" },
            { gif: "images/it_ride_firetruck.gif", who: "It", whoImg: "symbols/it.png", doing: "rides", doingImg: "symbols/ride.png", what: "firetruck", whatImg: "symbols/firetruck.png" },
            { gif: "images/it_want_hotdog.gif", who: "It", whoImg: "symbols/it.png", doing: "wants", doingImg: "symbols/want.png", what: "hot dog", whatImg: "symbols/hotdog.png" },
            { gif: "images/it_want_water.gif", who: "It", whoImg: "symbols/it.png", doing: "wants", doingImg: "symbols/want.png", what: "water", whatImg: "symbols/water.png" },
            { gif: "images/it_eat_popcorn.gif", who: "It", whoImg: "symbols/it.png", doing: "eats", doingImg: "symbols/eat.png", what: "popcorn", whatImg: "symbols/popcorn.png" }
        ];

        // ---------- Helpers ----------
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Play a sound without throwing if the file is missing or the browser blocks it
        function safePlay(audio) {
            try {
                const p = audio.play();
                if (p && p.catch) p.catch(() => {});
            } catch (e) {}
        }

        // iPad/Safari only allows audio that was started by a tap, so "unlock" every sound on START
        function primeAudio() {
            currentDanceSong.src = danceSongs[0];
            [currentDanceSong, ...Object.values(sounds)].forEach(a => {
                a.muted = true;
                try {
                    const p = a.play();
                    if (p && p.then) p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
                    else a.muted = false;
                } catch (e) { a.muted = false; }
            });
        }

        function speak(text, callback) {
            if (!('speechSynthesis' in window)) { if (callback) callback(); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (callback) u.onend = callback;
            window.speechSynthesis.speak(u);
        }

        // Shrink symbols just enough that the bank, drop zone and buttons all fit on screen
        function fitSymbols(reset) {
            const root = document.documentElement;
            const bank = document.getElementById('word-bank');
            const ws = document.getElementById('workspace');
            let sw = reset ? 95 : (parseFloat(getComputedStyle(root).getPropertyValue('--sw')) || 95);
            root.style.setProperty('--sw', sw + 'px');
            let guard = 0;
            while (sw > 44 && guard++ < 60 &&
                   (bank.scrollHeight > bank.clientHeight + 1 || bank.scrollWidth > bank.clientWidth + 1 ||
                    ws.scrollHeight > ws.clientHeight + 1)) {
                sw -= 3;
                root.style.setProperty('--sw', sw + 'px');
            }
        }
        window.addEventListener('resize', () => { if (!document.getElementById('game-container').classList.contains('hidden')) fitSymbols(true); });
        window.addEventListener('orientationchange', () => setTimeout(() => fitSymbols(true), 300));

        // ---------- Settings ----------
        function toggleSettings() { const m = document.getElementById('settings-modal'); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
        function updateFoilText(val) { numFoils = parseInt(val); document.getElementById('foil-val').innerText = val; }
        function updateTrialText(val) { totalTrialsRequested = parseInt(val); document.getElementById('trial-count-val').innerText = val; }

        // ---------- Game flow ----------
        function startApp() {
            speak(""); // Fix for Safari/iPad speech synthesis
            primeAudio();

            sessionTrials = shuffle(trialsData).slice(0, totalTrialsRequested);
            const pContainer = document.getElementById('progress-container');
            const scoreDisplay = pContainer.querySelector('.score-display');
            pContainer.innerHTML = "";
            for (let i = 0; i < sessionTrials.length; i++) {
                const node = document.createElement('div'); node.className = "progress-node"; node.id = `node-${i}`; node.innerText = i + 1;
                pContainer.appendChild(node);
            }
            pContainer.appendChild(scoreDisplay);
            document.getElementById('audio-unlock-overlay').style.display = 'none';
            loadTrial();
        }

        function loadTrial() {
            const nodes = document.querySelectorAll('.progress-node');
            nodes.forEach((n, i) => { n.classList.remove('node-active'); if (i === currentIndex) n.classList.add('node-active'); });
            const trial = sessionTrials[currentIndex];
            document.getElementById('trial-gif').src = trial.gif;
            document.getElementById('drop-zone').innerHTML = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('check-btn').style.display = "inline-block";
            document.getElementById('next-btn').style.display = "none";

            let items = [{ text: trial.who, type: "who", img: trial.whoImg }, { text: trial.doing, type: "doing", img: trial.doingImg }, { text: trial.what, type: "what", img: trial.whatImg }];
            let foilsAdded = 0;
            for (let r of shuffle(trialsData)) {
                if (foilsAdded >= numFoils) break;
                let foilType = Math.random() > 0.5 ? "doing" : "what";
                let foilItem = { text: r[foilType], type: foilType, img: r[foilType + "Img"] };
                if (!items.find(i => i.text === foilItem.text)) { items.push(foilItem); foilsAdded++; }
            }

            const bank = document.getElementById('word-bank');
            bank.innerHTML = "";
            shuffle(items).forEach(item => {
                const div = document.createElement('div');
                div.className = `symbol ${item.type}`; div.draggable = true; div.dataset.text = item.text;
                div.innerHTML = `<img src="${item.img}" draggable="false" alt=""><span>${item.text}</span>`;
                div.onpointerdown = () => speak(item.text);
                div.addEventListener('dragstart', (e) => e.target.classList.add('dragging'));
                div.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
                bank.appendChild(div);
            });
            fitSymbols(true);
        }

        const dropZone = document.getElementById('drop-zone');
        const wordBank = document.getElementById('word-bank');
        [dropZone, wordBank].forEach(zone => {
            zone.addEventListener('dragover', e => e.preventDefault());
            zone.addEventListener('drop', e => {
                const d = document.querySelector('.dragging');
                if (d) {
                    zone.appendChild(d);
                    if (zone.id === "drop-zone") { sounds.drop.currentTime = 0; safePlay(sounds.drop); }
                    fitSymbols(false);
                }
            });
        });

        // Show the dance + music reward once, and only if the player is still on the same trial
        function showReward(trialIndex) {
            if (rewardShown || trialIndex !== currentIndex) return;
            rewardShown = true;
            clearTimeout(rewardTimer);
            document.getElementById('dance-gif').src = danceGifs[Math.floor(Math.random() * danceGifs.length)] + "?t=" + Date.now();
            document.getElementById('dance-overlay').style.display = "flex";
            currentDanceSong.src = danceSongs[Math.floor(Math.random() * danceSongs.length)];
            currentDanceSong.loop = true;
            safePlay(currentDanceSong);
        }

        function checkAnswer() {
            const placed = Array.from(dropZone.children);
            const trial = sessionTrials[currentIndex];
            const isCorrect = (placed.length === 3) && (placed[0].dataset.text === trial.who) && (placed[1].dataset.text === trial.doing) && (placed[2].dataset.text === trial.what);
            trialLog.push({ num: currentIndex + 1, target: `${trial.who} ${trial.doing} ${trial.what}`, status: isCorrect ? "Pass" : "Fail" });
            if (isCorrect) {
                document.getElementById('feedback').innerText = "HEROIC!"; document.getElementById('feedback').style.color = "#4caf50";
                score++; document.getElementById('score-val').innerText = score;
                document.getElementById(`node-${currentIndex}`).classList.add('node-complete');
                rewardShown = false;
                const idx = currentIndex;
                speak(`${trial.who} ${trial.doing} ${trial.what}`, () => showReward(idx));
                // Backup in case the browser never reports the speech as finished
                rewardTimer = setTimeout(() => showReward(idx), 6000);
            } else {
                document.getElementById('feedback').innerText = "TRY AGAIN!"; document.getElementById('feedback').style.color = "#e74c3c";
                safePlay(sounds.incorrect);
            }
            document.getElementById('check-btn').style.display = "none";
            document.getElementById('next-btn').style.display = "inline-block";
        }

        function nextTrial() {
            clearTimeout(rewardTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('dance-overlay').style.display = "none";

            // Stop and reset the looping music
            currentDanceSong.pause();
            currentDanceSong.currentTime = 0;

            currentIndex++;
            if (currentIndex < sessionTrials.length) loadTrial(); else showResults();
        }

        function showResults() {
            const total = sessionTrials.length;
            // 1. Prepare results screen in background
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-pct').innerText = Math.round(score / total * 100) + "%";
            document.getElementById('log-body').innerHTML = trialLog.map(t => `<tr><td>${t.num}</td><td>${t.target}</td><td style="color:${t.status === 'Pass' ? '#2ecc71' : '#e74c3c'}; font-weight:bold;">${t.status}</td></tr>`).join("");

            // 2. Play celebration overlay if high score
            if (score / total >= 0.7) {
                const cOverlay = document.getElementById('celebration-overlay');
                cOverlay.style.display = 'flex';
                cOverlay.style.opacity = '1';
                safePlay(sounds.celebration);

                // 3. Transition timer (5 seconds)
                setTimeout(() => {
                    cOverlay.style.opacity = '0'; // Start fade
                    setTimeout(() => { cOverlay.style.display = 'none'; }, 1000);
                }, 5000);
            }
        }
    </script>
</body>
</html>
