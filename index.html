<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AAC Activity Hub</title>
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 40px; font-size: 2.5rem; }
        .menu-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .card {
            width: 280px;
            padding: 25px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            border: 6px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover { transform: translateY(-15px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }

        /* Theme Borders */
        .dogman-card { border-color: #f5a623; }
        .roblox-card { border-color: #e2231a; }

        .card img { width: 180px; height: 180px; border-radius: 20px; object-fit: cover; margin-bottom: 20px; border: 4px solid #eee; }
        .card h2 { margin: 10px 0; color: #2c3e50; }
        .card p { color: #636e72; font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>Pick Your Adventure!</h1>

    <div class="menu-container">
        <a href="index_dogman.html" class="card dogman-card">
            <img src="images/dogman_celebration.gif" alt="Dog Man">
            <h2>🐶 Dog Man</h2>
            <p>Join Dog Man and his friends for a silly, action-packed comic adventure!</p>
        </a>

        <a href="index_roblox.html" class="card roblox-card">
            <img src="images/roblox_celebration.gif" alt="Roblox">
            <h2>🎮 Roblox</h2>
            <p>Jump into the blocky world of Roblox and build your message level-by-level!</p>
        </a>
    </div>

</body>
</html>
